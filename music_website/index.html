<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sam's Playlist</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: #120806;
      color: #fff;
    }
    
    .glass-panel {
      background: rgba(20, 10, 8, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9), inset 0 1px 1px rgba(255, 255, 255, 0.2);
    }

    .glass-pill {
      background: rgba(18, 8, 6, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.15);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glass-pill:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.35);
      transform: translateY(-1px);
    }

    .record-spin {
      animation: spin 4s linear infinite;
    }
    .record-spin-paused {
      animation-play-state: paused;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="h-screen w-full overflow-hidden relative selection:bg-amber-500/40">
  
  <!-- Background Image -->
  <div class="absolute inset-0 z-0">
    <!-- Local artwork background -->
    <img src="./Gemini_Generated_Image_xbfvssxbfvssxbfv.png" 
         alt="Retro background" class="w-full h-full object-cover opacity-60 mix-blend-overlay">
    <div class="absolute inset-0 bg-gradient-to-b from-[#120806]/80 via-[#120806]/40 to-[#120806]/90"></div>
  </div>

  <!-- Main Content -->
  <main class="relative z-10 flex flex-col h-full p-4 sm:p-6 md:p-8">
    
    <!-- Center Title Area -->
    <div class="flex-1 flex flex-col justify-center items-center w-full">
      <header class="w-full text-center">
        <h1 class="text-5xl md:text-7xl font-black tracking-widest uppercase text-transparent bg-clip-text bg-gradient-to-b from-amber-100 via-amber-400 to-amber-600" style="filter: drop-shadow(0 10px 15px rgba(245,158,11,0.3));">
          Sam's Playlist
        </h1>
      </header>
    </div>

    <!-- Bottom Player -->
    <div class="flex-none flex flex-col items-center w-full max-w-5xl mx-auto pb-8 sm:pb-12">
      
      <div class="glass-panel w-full max-w-xl rounded-[24px] p-4 flex items-center gap-4">
        
        <!-- Record Cover -->
        <div class="relative w-14 h-14 shrink-0 rounded-full bg-neutral-900 border border-white/20 p-[2px] shadow-lg cursor-pointer group">
          <div id="record" class="w-full h-full rounded-full overflow-hidden record-spin record-spin-paused">
            <img src="https://images.unsplash.com/photo-1614680376593-902f74cf0d41?q=80&w=200&auto=format&fit=crop" class="w-full h-full object-cover" alt="Album Art">
          </div>
          <!-- Record Hole -->
          <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-2 h-2 bg-neutral-950 rounded-full border border-white/40"></div>
        </div>

        <!-- Track Info -->
        <div class="flex-1 min-w-0 flex flex-col w-full overflow-hidden">
          <div class="flex justify-between items-end gap-2 overflow-hidden">
            <marquee scrollamount="3" id="trackTitle" class="text-sm font-bold text-white whitespace-nowrap">Loading track...</marquee>
          </div>
          <p id="trackAuthor" class="text-[11px] text-white/60 truncate mt-0.5">YouTube Playlist</p>
          
          <!-- Progress Bar -->
          <div class="mt-2 flex items-center gap-2 text-[10px] font-mono text-white/50">
            <span id="currentTime">00:00</span>
            <div id="progressBar" class="flex-1 h-1.5 bg-white/20 rounded-full overflow-hidden cursor-pointer relative">
              <div id="progressFill" class="absolute top-0 left-0 h-full bg-amber-500 w-0 rounded-full transition-all duration-[250ms] ease-linear pointer-events-none"></div>
            </div>
            <span id="duration">00:00</span>
          </div>
        </div>

        <!-- Controls -->
        <div class="flex items-center gap-2 shrink-0">
          <button id="prevBtn" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 border border-white/20 flex items-center justify-center transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4 text-white/90">
              <path d="M9.195 18.44c1.25.713 2.805-.19 2.805-1.629v-3.353l8.608 4.908c1.25.713 2.805-.19 2.805-1.629V7.262c0-1.438-1.555-2.342-2.805-1.628L12 10.541V7.188c0-1.439-1.555-2.343-2.805-1.629L.587 10.467c-1.25.713-1.25 2.52 0 3.233l8.608 4.74z" />
            </svg>
          </button>
          
          <button id="playBtn" class="w-10 h-10 rounded-full bg-amber-500 hover:bg-amber-400 text-black shadow-[0_0_15px_rgba(245,158,11,0.5)] flex items-center justify-center transition-transform hover:scale-105">
            <svg id="playIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 ml-0.5">
              <path fill-rule="evenodd" d="M4.5 5.653c0-1.426 1.529-2.33 2.779-1.643l11.54 6.348c1.295.712 1.295 2.573 0 3.285L7.28 19.991c-1.25.687-2.779-.217-2.779-1.643V5.653z" clip-rule="evenodd" />
            </svg>
            <svg id="pauseIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 hidden">
              <path fill-rule="evenodd" d="M6.75 5.25a.75.75 0 01.75-.75H9a.75.75 0 01.75.75v13.5a.75.75 0 01-.75.75H7.5a.75.75 0 01-.75-.75V5.25zm7.5 0a.75.75 0 01.75-.75h1.5a.75.75 0 01.75.75v13.5a.75.75 0 01-.75.75h-1.5a.75.75 0 01-.75-.75V5.25z" clip-rule="evenodd" />
            </svg>
          </button>

          <button id="nextBtn" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 border border-white/20 flex items-center justify-center transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4 text-white/90">
              <path d="M14.805 5.56c-1.25-.713-2.805.19-2.805 1.629v3.353L3.392 5.634C2.142 4.92.587 5.824.587 7.262v9.476c0 1.438 1.555 2.342 2.805 1.628L12 13.459v3.353c0 1.439 1.555 2.343 2.805 1.629l8.608-4.908c1.25-.713 1.25-2.52 0-3.233l-8.608-4.74z" />
            </svg>
          </button>
        </div>
      </div>
      
      <!-- Bottom Actions -->
      <div class="fixed bottom-6 right-6 flex flex-col items-end gap-3 z-50">
        <button id="breezeBtn" class="glass-pill px-4 py-2 rounded-full text-[11px] font-bold text-white flex items-center gap-2 hover:bg-white/20 transition-all cursor-pointer">
          <span>🍃</span> Breeze Effect
        </button>
      </div>

  </main>
  <!-- Hidden YouTube Player -->
  <div class="fixed bottom-0 right-0 w-0 h-0 opacity-0 pointer-events-none -z-10">
    <div id="yt-player"></div>
  </div>

  <script>
    // ==========================================
    // ⚙️ CUSTOM AUDIO TRACKS CONFIGURATION
    // ==========================================
    // Paste the YouTube Video IDs for the songs you want to play.
    // The video ID is the 11-character string after "v=" in a YouTube URL.
    const CUSTOM_SONG_LIST = [
      '3S8TjYCAUTU', // 1. User provided ID
      'fEIEZQ2Dos8', // 2. User provided ID
      'tuxzfwUVSlE', // 3. User provided ID
      'dRBckbKj2Wo', // 4. User provided ID
      'CuNvY5_WgxQ', // 5. User provided ID
      'xnfggj-uo94', // 6. User provided ID
      'zP_SCYHXwOc', // 7. User provided ID
      'mREpTe3HZ4c', // 8. User provided ID
      'ZifgKwiqKV0', // 9. User provided ID
      'CCbhNA7YiJ4'  // 10. User provided ID
    ];
    // ==========================================

    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const record = document.getElementById('record');
    
    let isPlaying = false;
    let player;
    let isPlayerReady = false;

    // 1. Load the YouTube IFrame Player API code asynchronously
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    // 2. This function creates an <iframe> (and YouTube player) after the API code downloads
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('yt-player', {
        height: '0',
        width: '0',
        playerVars: {
          'autoplay': 0,
          'controls': 0,
          'disablekb': 1,
          'fs': 0,
          'rel': 0,
          'playsinline': 1
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerReady(event) {
      isPlayerReady = true;
      // Cue the custom array of songs to act as a dynamic playlist
      player.cuePlaylist(CUSTOM_SONG_LIST);
      
      // Wait a brief moment for the playlist to cue, then enable shuffle and loop
      setTimeout(() => {
        player.setShuffle(true);
        player.setLoop(true);
      }, 200);
    }

    let progressInterval;

    function formatTime(seconds) {
      if (!seconds) return "00:00";
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
    }

    function updateTrackInfo() {
      if (player && player.getVideoData) {
        const data = player.getVideoData();
        if (data && data.title) {
          document.getElementById('trackTitle').innerText = data.title;
          document.getElementById('trackAuthor').innerText = data.author || "YouTube Video";
        }
      }
    }

    function onPlayerStateChange(event) {
      // YT.PlayerState.PLAYING = 1, PAUSED = 2
      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        playIcon.classList.add('hidden');
        pauseIcon.classList.remove('hidden');
        record.classList.remove('record-spin-paused');
        updateTrackInfo();
        
        clearInterval(progressInterval);
        progressInterval = setInterval(() => {
          if (player && player.getCurrentTime) {
            const current = player.getCurrentTime();
            const duration = player.getDuration();
            document.getElementById('currentTime').innerText = formatTime(current);
            document.getElementById('duration').innerText = formatTime(duration);
            if (duration > 0) {
              const percentage = (current / duration) * 100;
              document.getElementById('progressFill').style.width = percentage + "%";
            }
          }
        }, 500);

      } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
        isPlaying = false;
        pauseIcon.classList.add('hidden');
        playIcon.classList.remove('hidden');
        record.classList.add('record-spin-paused');
        clearInterval(progressInterval);
      }
    }

    document.getElementById('progressBar').addEventListener('click', (e) => {
      if (!isPlayerReady || !player.getDuration) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const pos = (e.clientX - rect.left) / rect.width;
      const seekTime = pos * player.getDuration();
      player.seekTo(seekTime, true);
    });

    playBtn.addEventListener('click', () => {
      if (!isPlayerReady) return;
      
      if (isPlaying) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    });

    const nextBtn = document.getElementById('nextBtn');
    const prevBtn = document.getElementById('prevBtn');

    nextBtn.addEventListener('click', () => {
      if (isPlayerReady) player.nextVideo();
    });

    prevBtn.addEventListener('click', () => {
      if (isPlayerReady) player.previousVideo();
    });

    // Breeze Sound Effect Logic
    const breezeBtn = document.getElementById('breezeBtn');
    const breezeAudio = new Audio('https://actions.google.com/sounds/v1/weather/wind_blowing_through_trees.ogg');
    
    breezeBtn.addEventListener('click', () => {
      breezeAudio.currentTime = 0;
      breezeAudio.play();
    });
  </script>
</body>
</html>
